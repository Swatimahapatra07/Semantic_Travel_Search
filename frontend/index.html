<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Semantic Travel Search</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌄 Semantic Travel Search</h1>

        <p class="subtitle">
            Find travel destinations based on what you want to experience.
        </p>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Example: peaceful mountain with greenery"
            >

            <button onclick="searchDestinations()">
                Search
            </button>

        </div>

        <div id="loading"></div>

        <div id="results"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
